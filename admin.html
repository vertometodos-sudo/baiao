<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Painel</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f3f4f6;color:#111827;min-height:100vh;-webkit-font-smoothing:antialiased}
.hidden{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 90px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:8px}
.top h2{font-size:20px}
.box{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.box h3{font-size:15px;margin-bottom:12px}
label{display:block;font-size:13px;font-weight:600;color:#374151;margin:10px 0 4px}
input[type=text],input[type=email],input[type=password],input[type=url],textarea{width:100%;font-size:16px;font-family:inherit;padding:11px 12px;border:1px solid #d1d5db;border-radius:10px;background:#fff;color:#111}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus{outline:2px solid #2563eb;border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:600;padding:11px 16px;border-radius:10px;border:0;cursor:pointer;background:#111827;color:#fff;text-decoration:none;font-family:inherit}
.btn.full{width:100%}
.btn.sec{background:#e5e7eb;color:#111}
.btn.verde{background:#16a34a}
.btn.verm{background:#dc2626}
.btn.peq{padding:7px 10px;font-size:13px}
.btn:disabled{opacity:.5}
.msg{font-size:14px;padding:10px 12px;border-radius:10px;margin-top:10px}
.msg.erro{background:#fee2e2;color:#991b1b}
.msg.ok{background:#dcfce7;color:#166534}
.hint{font-size:12px;color:#6b7280;margin-top:4px}
.imgrow{display:flex;gap:12px;align-items:center}
.prev{width:64px;height:64px;border-radius:12px;object-fit:cover;background:#e5e7eb;flex-shrink:0}
.prev.round{border-radius:50%}
.prev.mini{width:44px;height:44px;border-radius:10px}
.linkrow{border:1px solid #e5e7eb;border-radius:12px;padding:10px;margin-bottom:10px}
.linkrow input{margin-bottom:6px}
.linkacts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.linkacts .esp{flex:1}
.colorrow{display:flex;align-items:center;gap:10px}
.colorrow input[type=color]{width:52px;height:40px;border:0;background:none;padding:0}
.sticky{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(243,244,246,.95);border-top:1px solid #e5e7eb}
.sticky .btn{max-width:528px;margin:0 auto;display:flex}
.stat{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px solid #f3f4f6}
.stat span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:10px}
.kpis{display:flex;gap:10px;margin-bottom:10px}
.kpi{flex:1;background:#f9fafb;border-radius:12px;padding:12px;text-align:center}
.kpi b{display:block;font-size:22px}
.kpi span{font-size:12px;color:#6b7280}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90vw;text-align:center}
</style>
</head>
<body>
<div id="app" class="wrap"></div>

<script>
const CFG = window.APP_CONFIG || {};
const app = document.getElementById("app");
const SITE = new URL("./", location.href).href;          // endereço da página pública
const PAINEL = new URL("admin.html", SITE).href;
let sb;

/* ---------- utilidades ---------- */
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs || {})){
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "style") el.style.cssText = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()){
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
function toast(t){ const el = h("div",{class:"toast",text:t}); document.body.append(el); setTimeout(()=>el.remove(), 2800); }
function safeUrl(u){
  try{ const x = new URL(u); return ["http:","https:","mailto:","tel:"].includes(x.protocol); }catch{ return false; }
}
function normalizarUrl(u){
  u = (u || "").trim();
  if (!u) return "";
  if (/^(https?:|mailto:|tel:)/i.test(u)) return u;
  return "https://" + u;
}
function traduzErro(e){
  const m = (e && (e.message || e.error_description)) || String(e);
  if (/Invalid login credentials/i.test(m)) return "E-mail ou senha incorretos.";
  if (/Email not confirmed/i.test(m)) return "E-mail ainda não confirmado.";
  if (/Password should be at least/i.test(m)) return "A senha precisa ter pelo menos 6 caracteres.";
  if (/rate limit/i.test(m)) return "Muitas tentativas. Espere alguns minutos.";
  if (/row-level security|permission/i.test(m)) return "Sem permissão. Saia e entre de novo.";
  return m;
}

/* ---------- fotos: reduz e converte para JPG (resolve HEIC do iPhone) ---------- */
function carregarImg(src){
  return new Promise((ok, falha)=>{ const i = new Image(); i.onload=()=>ok(i); i.onerror=falha; i.src=src; });
}
async function prepararImagem(file, max){
  const url = URL.createObjectURL(file);
  try{
    const img = await carregarImg(url);
    const esc = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * esc); c.height = Math.round(img.height * esc);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
  } finally { URL.revokeObjectURL(url); }
}
async function enviarImagem(tipo, file){
  const blob = await prepararImagem(file, tipo === "fundo" ? 1600 : 600);
  if (!blob) throw new Error("Não consegui ler essa imagem. Tente outra.");
  const caminho = `${tipo}-${Date.now()}.jpg`;
  const { error } = await sb.storage.from("midia").upload(caminho, blob, { contentType:"image/jpeg" });
  if (error) throw error;
  return sb.storage.from("midia").getPublicUrl(caminho).data.publicUrl;
}
function botaoFoto(rotulo, tipo, aoEnviar){
  const file = h("input",{type:"file",accept:"image/*",class:"hidden"});
  const bt = h("button",{class:"btn sec peq",text:rotulo,onclick:()=>file.click()});
  file.addEventListener("change", async ()=>{
    const f = file.files[0]; if (!f) return;
    const txt = bt.textContent; bt.disabled = true; bt.textContent = "Enviando…";
    try{ aoEnviar(await enviarImagem(tipo, f)); toast("Foto enviada. Toque em Salvar."); }
    catch(e){ toast(traduzErro(e)); }
    bt.disabled = false; bt.textContent = txt; file.value = "";
  });
  return [bt, file];
}

/* ---------- login ---------- */
function telaLogin(){
  app.innerHTML = "";
  const email = h("input",{type:"email",autocomplete:"email",placeholder:"seu@email.com"});
  const senha = h("input",{type:"password",autocomplete:"current-password",placeholder:"Sua senha"});
  const msg = h("div");
  const aviso = (t, tipo)=>{ msg.innerHTML = ""; if (t) msg.append(h("div",{class:"msg "+(tipo||"erro"),text:t})); };
  const bt = h("button",{class:"btn full",text:"Entrar",style:"margin-top:14px",onclick:async()=>{
    bt.disabled = true; aviso("");
    const { error } = await sb.auth.signInWithPassword({ email:email.value.trim(), password:senha.value });
    bt.disabled = false;
    if (error) return aviso(traduzErro(error));
    painel();
  }});
  senha.addEventListener("keydown", e=>{ if (e.key === "Enter") bt.click(); });
  const esqueci = h("button",{class:"btn sec full",text:"Esqueci a senha",style:"margin-top:8px",onclick:async()=>{
    if (!email.value.trim()) return aviso("Digite seu e-mail acima primeiro.");
    const { error } = await sb.auth.resetPasswordForEmail(email.value.trim(), { redirectTo: PAINEL });
    aviso(error ? traduzErro(error) : "Enviamos um link para criar nova senha. Veja seu e-mail (e o spam).", error ? "erro" : "ok");
  }});
  app.append(
    h("div",{class:"top"}, h("h2",{text:"Painel"})),
    h("div",{class:"box"}, h("label",{text:"E-mail"}), email, h("label",{text:"Senha"}), senha, bt, esqueci, msg)
  );
}

function telaNovaSenha(){
  app.innerHTML = "";
  const senha = h("input",{type:"password",autocomplete:"new-password",placeholder:"Nova senha (mín. 6)"});
  const msg = h("div");
  app.append(h("div",{class:"box"},
    h("h3",{text:"Criar nova senha"}), senha,
    h("button",{class:"btn full",text:"Salvar senha",style:"margin-top:12px",onclick:async()=>{
      const { error } = await sb.auth.updateUser({ password:senha.value });
      msg.innerHTML = "";
      if (error) return msg.append(h("div",{class:"msg erro",text:traduzErro(error)}));
      toast("Senha alterada!");
      history.replaceState(null, "", PAINEL);
      painel();
    }}), msg
  ));
}

/* ---------- painel ---------- */
async function painel(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) return telaLogin();

  const { data:p, error } = await sb.from("pagina").select("*").eq("id",1).maybeSingle();
  if (error || !p){
    app.innerHTML = "";
    app.append(h("div",{class:"msg erro",text:"Não encontrei a página no banco. Rode o arquivo supabase.sql no Supabase."}));
    return;
  }

  const est = {
    nome:p.nome || "", bio:p.bio || "", cor:p.cor || "#344e1c",
    avatar_url:p.avatar_url, fundo_url:p.fundo_url,
    links:(Array.isArray(p.links) ? p.links : []).map(l=>({ titulo:l.titulo||"", url:l.url||"", icone:l.icone||null }))
  };
  app.innerHTML = "";

  // perfil
  const inNome = h("input",{type:"text",value:est.nome,oninput:e=>est.nome=e.target.value});
  const inBio = h("textarea",{maxlength:"200",oninput:e=>est.bio=e.target.value}); inBio.value = est.bio;
  const inCor = h("input",{type:"color",value:est.cor,oninput:e=>est.cor=e.target.value});

  // fotos
  function campoFoto(tipo, titulo, redondo){
    const prev = h("img",{class:"prev"+(redondo?" round":""),alt:""});
    if (est[tipo+"_url"]) prev.src = est[tipo+"_url"];
    const [bt, file] = botaoFoto("Trocar foto", tipo, url=>{ est[tipo+"_url"] = url; prev.src = url; });
    const rm = h("button",{class:"btn sec peq",text:"Remover",onclick:()=>{ est[tipo+"_url"] = null; prev.removeAttribute("src"); }});
    return h("div",{}, h("label",{text:titulo}), h("div",{class:"imgrow"}, prev, h("div",{style:"display:flex;gap:6px;flex-wrap:wrap"}, bt, rm), file));
  }

  // links
  const lista = h("div");
  function desenharLinks(){
    lista.innerHTML = "";
    if (!est.links.length) lista.append(h("p",{class:"hint",text:"Nenhum botão ainda. Toque em + Adicionar botão."}));
    est.links.forEach((l, i)=>{
      const t = h("input",{type:"text",placeholder:"Texto do botão (ex: 565-Bet)",value:l.titulo,oninput:e=>l.titulo=e.target.value});
      const u = h("input",{type:"url",placeholder:"Link (https://…)",value:l.url,autocapitalize:"none",autocorrect:"off",oninput:e=>l.url=e.target.value});
      const ic = h("img",{class:"prev mini",alt:""}); if (l.icone) ic.src = l.icone;
      const [btIc, fileIc] = botaoFoto(l.icone ? "Trocar ícone" : "Pôr ícone", "icone", url=>{ l.icone = url; desenharLinks(); });
      const rmIc = l.icone ? h("button",{class:"btn sec peq",text:"Tirar ícone",onclick:()=>{ l.icone = null; desenharLinks(); }}) : null;
      const mover = d=>{ const j = i + d; if (j < 0 || j >= est.links.length) return; [est.links[i], est.links[j]] = [est.links[j], est.links[i]]; desenharLinks(); };
      lista.append(h("div",{class:"linkrow"}, t, u,
        h("div",{class:"linkacts"}, ic, btIc, rmIc, fileIc, h("span",{class:"esp"}),
          h("button",{class:"btn sec peq",text:"↑",onclick:()=>mover(-1)}),
          h("button",{class:"btn sec peq",text:"↓",onclick:()=>mover(1)}),
          h("button",{class:"btn verm peq",text:"Excluir",onclick:()=>{ if (confirm("Excluir este botão?")){ est.links.splice(i,1); desenharLinks(); } }})
        )
      ));
    });
  }
  desenharLinks();
  const add = h("button",{class:"btn sec full",text:"+ Adicionar botão",onclick:()=>{
    if (est.links.length >= 20) return toast("Máximo de 20 botões.");
    est.links.push({ titulo:"", url:"", icone:null }); desenharLinks();
  }});

  // salvar
  const salvar = h("button",{class:"btn verde full",text:"Salvar alterações",onclick:async()=>{
    const links = est.links.map(l=>({ titulo:l.titulo.trim(), url:normalizarUrl(l.url), icone:l.icone || null })).filter(l=>l.url);
    if (links.some(l=>!safeUrl(l.url))) return toast("Tem um link inválido. Confira os endereços.");
    salvar.disabled = true; salvar.textContent = "Salvando…";
    const { error } = await sb.from("pagina").update({
      nome:est.nome.trim(), bio:est.bio.trim(), cor:est.cor,
      avatar_url:est.avatar_url, fundo_url:est.fundo_url, links, atualizado_em:new Date().toISOString()
    }).eq("id", 1);
    salvar.disabled = false; salvar.textContent = "Salvar alterações";
    if (error) return toast(traduzErro(error));
    est.links = links; desenharLinks();
    toast("Salvo! A página já está atualizada.");
  }});

  // cliques
  const boxStats = h("div",{class:"box"}, h("h3",{text:"Cliques nos últimos 30 dias"}), h("p",{class:"hint",text:"Carregando…"}));
  (async ()=>{
    const desde = new Date(Date.now() - 30*864e5).toISOString();
    const { data, error } = await sb.from("cliques").select("url,created_at").gte("created_at", desde).limit(20000);
    boxStats.lastChild.remove();
    if (error) return boxStats.append(h("p",{class:"hint",text:"Não foi possível carregar."}));
    if (!data.length) return boxStats.append(h("p",{class:"hint",text:"Nenhum clique ainda."}));
    const hoje = new Date().toDateString();
    const porUrl = {};
    data.forEach(c=>{ porUrl[c.url] = (porUrl[c.url] || 0) + 1; });
    boxStats.append(h("div",{class:"kpis"},
      h("div",{class:"kpi"}, h("b",{text:String(data.length)}), h("span",{text:"30 dias"})),
      h("div",{class:"kpi"}, h("b",{text:String(data.filter(c=>new Date(c.created_at).toDateString()===hoje).length)}), h("span",{text:"hoje"}))
    ));
    Object.entries(porUrl).sort((a,b)=>b[1]-a[1]).forEach(([u,n])=>
      boxStats.append(h("div",{class:"stat"}, h("span",{text:u.replace(/^https?:\/\//,"")}), h("b",{text:String(n)}))));
  })();

  app.append(
    h("div",{class:"top"},
      h("h2",{text:"Minha página"}),
      h("div",{style:"display:flex;gap:6px"},
        h("a",{class:"btn sec peq",href:SITE,target:"_blank",text:"Ver página"}),
        h("button",{class:"btn sec peq",text:"Sair",onclick:async()=>{ await sb.auth.signOut(); telaLogin(); }})
      )
    ),
    h("div",{class:"box"},
      h("h3",{text:"Perfil"}),
      h("label",{text:"Nome"}), inNome,
      h("label",{text:"Frase / bio"}), inBio,
      h("label",{text:"Cor dos botões"}), h("div",{class:"colorrow"}, inCor, h("span",{class:"hint",text:"Toque para escolher"}))
    ),
    h("div",{class:"box"},
      h("h3",{text:"Fotos"}),
      campoFoto("avatar","Foto do perfil (redonda)",true),
      campoFoto("fundo","Foto de fundo",false)
    ),
    h("div",{class:"box"}, h("h3",{text:"Botões / links"}), lista, add),
    boxStats,
    h("div",{class:"box"},
      h("h3",{text:"Link para a bio"}),
      h("input",{type:"text",value:SITE,readonly:true,onclick:e=>e.target.select()}),
      h("button",{class:"btn sec full",text:"Copiar link",style:"margin-top:8px",onclick:()=>{
        navigator.clipboard?.writeText(SITE).then(()=>toast("Link copiado!"), ()=>toast("Segure no campo para copiar."));
      }})
    ),
    h("div",{class:"sticky"}, salvar)
  );
}

/* ---------- início ---------- */
(function(){
  if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY || !window.supabase){
    app.append(h("div",{class:"msg erro",text:"Configuração pendente: preencha o arquivo config.js com os dados do Supabase."}));
    return;
  }
  sb = window.supabase.createClient(CFG.SUPABASE_URL.trim().replace(/\/+$/, ""), CFG.SUPABASE_ANON_KEY.trim());
  let recuperando = false;
  sb.auth.onAuthStateChange(ev=>{ if (ev === "PASSWORD_RECOVERY"){ recuperando = true; telaNovaSenha(); } });
  const iniciar = ()=>{ if (!recuperando) painel(); };
  if (/access_token|type=recovery|code=/.test(location.hash + location.search)) setTimeout(iniciar, 700);
  else iniciar();
})();
</script>
</body>
</html>
