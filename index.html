<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1a0f">
<title>Meus Links</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#fff;background:#0f1a0f;min-height:100vh;
    display:flex;justify-content:center;
  }
  .bg{
    position:fixed;inset:0;z-index:0;
    background:linear-gradient(160deg,#1f3a1f,#0b120b);
    background-size:cover;background-position:center;
  }
  .bg::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,.05) 40%,rgba(0,0,0,.55) 100%)}
  main{position:relative;z-index:1;width:100%;max-width:480px;padding:56px 20px 40px;
    display:flex;flex-direction:column;align-items:center;gap:14px}
  .avatar{width:104px;height:104px;border-radius:50%;border:4px solid #111;
    object-fit:cover;background:#2a4a2a;box-shadow:0 6px 20px rgba(0,0,0,.35)}
  h1{font-size:28px;font-weight:700;text-shadow:0 2px 10px rgba(0,0,0,.5);text-align:center}
  .bio{font-size:15px;opacity:.95;text-shadow:0 1px 6px rgba(0,0,0,.6);text-align:center;margin-bottom:10px}
  .links{width:100%;display:flex;flex-direction:column;gap:12px}
  a.card{
    display:flex;align-items:center;gap:14px;text-decoration:none;color:#fff;
    background:rgba(52,78,28,.92);border:1px solid rgba(255,255,255,.12);
    border-radius:16px;padding:12px 14px;backdrop-filter:blur(6px);
    box-shadow:0 6px 18px rgba(0,0,0,.3);transition:transform .12s ease,filter .12s ease;
  }
  a.card:active{transform:scale(.98)}
  a.card:hover{filter:brightness(1.08)}
  .icon{width:56px;height:56px;border-radius:12px;flex-shrink:0;object-fit:cover;
    background:#e7b53c;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:22px;color:#fff}
  .txt{flex:1;min-width:0}
  .title{font-size:17px;font-weight:600}
  .sub{font-size:13px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .arrow{width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  footer{margin-top:24px;font-size:12px;opacity:.6;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.6)}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<main>
  <img class="avatar" id="avatar" alt="">
  <h1 id="nome"></h1>
  <p class="bio" id="bio"></p>
  <div class="links" id="links"></div>
  <footer id="rodape"></footer>
</main>

<script>
/* =========================================================
   EDITE SÓ ESTA PARTE
   - Imagens: coloque o caminho do arquivo (ex: "fundo.jpg",
     na mesma pasta do index.html) ou uma URL completa.
   - Links: adicione/remova blocos { ... } à vontade.
   - "icone": imagem (ex: "logo1.png") ou deixe "" para usar
     a letra inicial do título.
   ========================================================= */
const CONFIG = {
  nome:   "Lucas Baião🔞🎰",
  bio:    "Conta quem se arrisca! ✨",
  avatar: "",   // vazio = usa a foto embutida no fim do arquivo,
  fundo:  "",   // vazio = usa a foto embutida no fim do arquivo,
  rodape: "",
  links: [
    { titulo: "Link 1", url: "https://wgprincepersia.com/?id=301647794", icone: "", cor: "" },
    { titulo: "Link 2", url: "https://exemplo.com", icone: "", cor: "" },
    { titulo: "WhatsApp", url: "https://wa.me/5571999999999", icone: "", cor: "#1f8f4a" }
  ],
  // Repassa ?utm_... e fbclid que chegarem na página para os links
  repassarParametros: true
};
/* ========================================================= */

window.addEventListener("DOMContentLoaded", function(){
  CONFIG.avatar = CONFIG.avatar || window.IMG_AVATAR;
  CONFIG.fundo = CONFIG.fundo || window.IMG_FUNDO;
  const $ = id => document.getElementById(id);
  document.title = CONFIG.nome;
  $("nome").textContent = CONFIG.nome;
  $("bio").textContent = CONFIG.bio;
  $("rodape").textContent = CONFIG.rodape;

  const av = $("avatar");
  if (CONFIG.avatar) { av.src = CONFIG.avatar; av.onerror = () => av.removeAttribute("src"); }
  if (CONFIG.fundo) {
    const img = new Image();
    img.onload = () => { $("bg").style.backgroundImage = `url("${CONFIG.fundo}")`; };
    img.src = CONFIG.fundo;
  }

  const entrada = new URLSearchParams(location.search);
  const repassar = (url) => {
    if (!CONFIG.repassarParametros) return url;
    try {
      const u = new URL(url);
      for (const [k,v] of entrada) {
        if ((k.startsWith("utm_") || k === "fbclid") && !u.searchParams.has(k)) u.searchParams.set(k, v);
      }
      return u.toString();
    } catch { return url; }
  };

  const box = $("links");
  CONFIG.links.forEach(l => {
    const a = document.createElement("a");
    a.className = "card";
    a.href = repassar(l.url);
    a.target = "_blank";
    a.rel = "noopener";
    if (l.cor) a.style.background = l.cor;

    let icon;
    if (l.icone) {
      icon = document.createElement("img");
      icon.className = "icon"; icon.src = l.icone; icon.alt = "";
    } else {
      icon = document.createElement("div");
      icon.className = "icon";
      icon.textContent = (l.titulo || "?").trim().charAt(0).toUpperCase();
    }

    const txt = document.createElement("div");
    txt.className = "txt";
    const t = document.createElement("div"); t.className = "title"; t.textContent = l.titulo;
    const s = document.createElement("div"); s.className = "sub";
    s.textContent = l.url.replace(/^https?:\/\//, "");
    txt.append(t, s);

    const arrow = document.createElement("div");
    arrow.className = "arrow";
    arrow.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><path d="M7 17L17 7M9 7h8v8"/></svg>';

    a.append(icon, txt, arrow);
    box.appendChild(a);
  });
});
</script>
