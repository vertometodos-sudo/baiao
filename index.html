<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1a0f">
<title></title>
<script src="config.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff;background:#0f1a0f;min-height:100vh;display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:0;background:linear-gradient(160deg,#1f3a1f,#0b120b);background-size:cover;background-position:center;transition:opacity .4s}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.05) 40%,rgba(0,0,0,.55))}
main{position:relative;z-index:1;width:100%;max-width:480px;padding:56px 20px 40px;display:flex;flex-direction:column;align-items:center;gap:14px;opacity:0;transition:opacity .3s}
main.on{opacity:1}
.avatar{width:104px;height:104px;border-radius:50%;border:4px solid #111;object-fit:cover;background:rgba(255,255,255,.12);box-shadow:0 6px 20px rgba(0,0,0,.35)}
h1{font-size:28px;font-weight:700;text-shadow:0 2px 10px rgba(0,0,0,.5);text-align:center}
.bio{font-size:15px;text-shadow:0 1px 6px rgba(0,0,0,.6);text-align:center;margin-bottom:10px;white-space:pre-line}
.links{width:100%;display:flex;flex-direction:column;gap:12px}
a.card{display:flex;align-items:center;gap:14px;text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:12px 14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 6px 18px rgba(0,0,0,.3);transition:transform .12s}
a.card:active{transform:scale(.98)}
.icon{width:52px;height:52px;border-radius:12px;flex-shrink:0;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;object-fit:cover}
.txt{flex:1;min-width:0}
.title{font-size:17px;font-weight:600}
.sub{font-size:13px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.vazio{opacity:.7;font-size:14px;text-align:center;margin-top:40px}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<main id="main">
  <img class="avatar" id="avatar" alt="">
  <h1 id="nome"></h1>
  <p class="bio" id="bio"></p>
  <div class="links" id="links"></div>
</main>

<script>
(async function(){
  const CFG = window.APP_CONFIG || {};
  const $ = id => document.getElementById(id);
  const main = $("main");

  function safeUrl(u){
    try{ const x = new URL(u); return ["http:","https:","mailto:","tel:"].includes(x.protocol) ? x.toString() : null; }
    catch{ return null; }
  }
  function aviso(t){ main.innerHTML = ""; main.append(Object.assign(document.createElement("p"),{className:"vazio",textContent:t})); main.classList.add("on"); }

  if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY) return aviso("Página em configuração.");
  CFG.SUPABASE_URL = CFG.SUPABASE_URL.trim().replace(/\/+$/, "");
  const KEY = CFG.SUPABASE_ANON_KEY.trim();
  const HEAD = { apikey:KEY };
  if (KEY.startsWith("eyJ")) HEAD.Authorization = "Bearer " + KEY;   // chave antiga (anon); a nova (sb_publishable_) vai só no apikey

  let p;
  try{
    const r = await fetch(`${CFG.SUPABASE_URL}/rest/v1/pagina?id=eq.1&select=*`, {
      headers:HEAD
    });
    p = (await r.json())[0];
  }catch(e){}
  if (!p) return aviso("Não foi possível carregar a página. Tente de novo em instantes.");

  document.title = p.nome || "";
  $("nome").textContent = p.nome || "";
  $("bio").textContent = p.bio || "";
  if (p.avatar_url) $("avatar").src = p.avatar_url; else $("avatar").remove();
  if (p.fundo_url){
    const img = new Image();
    img.onload = () => { $("bg").style.backgroundImage = `url("${p.fundo_url}")`; };
    img.src = p.fundo_url;
  }
  const cor = /^#[0-9a-fA-F]{6}$/.test(p.cor) ? p.cor : "#344e1c";
  document.querySelector('meta[name="theme-color"]').content = cor;

  const entrada = new URLSearchParams(location.search);
  const repassar = url => {
    try{
      const u = new URL(url);
      if (!/^https?:$/.test(u.protocol)) return url;
      for (const [k,v] of entrada)
        if ((k.startsWith("utm_") || k === "fbclid") && !u.searchParams.has(k)) u.searchParams.set(k, v);
      return u.toString();
    }catch{ return url; }
  };
  const registrar = (i, url) => {
    try{
      fetch(`${CFG.SUPABASE_URL}/rest/v1/cliques`, {
        method:"POST", keepalive:true,
        headers:{ ...HEAD, "Content-Type":"application/json", Prefer:"return=minimal" },
        body: JSON.stringify({ link_idx:i, url, utm_source:entrada.get("utm_source") })
      }).catch(()=>{});
    }catch{}
  };

  const box = $("links");
  (Array.isArray(p.links) ? p.links : []).forEach((l, i) => {
    const url = safeUrl(l.url);
    if (!url) return;
    const a = document.createElement("a");
    a.className = "card";
    a.href = repassar(url);
    a.rel = "noopener";
    a.style.background = cor + "ee";
    a.addEventListener("click", () => registrar(i, url));

    let ic;
    if (l.icone){ ic = document.createElement("img"); ic.src = l.icone; ic.alt = ""; }
    else { ic = document.createElement("div"); ic.textContent = (l.titulo || "?").trim().charAt(0).toUpperCase(); }
    ic.className = "icon";

    const t = document.createElement("div"); t.className = "txt";
    const t1 = document.createElement("div"); t1.className = "title"; t1.textContent = l.titulo || "Link";
    const t2 = document.createElement("div"); t2.className = "sub"; t2.textContent = url.replace(/^https?:\/\//, "");
    t.append(t1, t2);

    const ar = document.createElement("div"); ar.className = "arrow";
    ar.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg>';

    a.append(ic, t, ar);
    box.append(a);
  });
  main.classList.add("on");
})();
</script>
</body>
</html>
